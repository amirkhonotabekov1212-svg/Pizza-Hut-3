<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Hut</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#FEDDDD] overflow-x-hidden">


    <div class="flex flex-wrap items-center justify-between gap-y-3 m-4 md:m-5">

        <nav class="order-last md:order-none w-full md:w-auto flex items-center justify-between md:justify-center gap-4 md:gap-8 text-sm sm:text-base">
            <p>Home</p>
            <p>About</p>
            <p>Offers</p>
            <p>Contact us</p>
        </nav>

        <button class="bg-[#D13E3E] text-white rounded-xl px-4 sm:px-6 py-2 text-sm sm:text-base">
            Sign in
        </button>
    </div>

    <!-- Hero -->
    <div class="mt-8 md:mt-16">
        <p class="text-[#D13E3E] px-5 text-sm sm:text-base">Today’s Special Pizza</p>

        <h1 class="text-4xl sm:text-5xl lg:text-6xl px-5 font-bold">
            hot garlic
        </h1>

        <p class="px-5 text-[#A48888] text-sm sm:text-base">
            Rich tomato sauce base topped with cream cheese, onions, green chil...
        </p>

        <div class="flex flex-col md:flex-row items-center md:justify-between gap-8 mt-8 md:mt-10 px-5">

            <!-- Thumbnails -->
            <div class="order-2 md:order-1 flex items-center justify-center md:justify-between gap-3 sm:gap-6 w-full md:flex-1">
                <a href="index2.html">
                    <img src="/top-view-pizza-with-ai-generated-free-png (1) 2.png"
                         class="w-[80px] sm:w-[120px] lg:w-[180px]" alt="Pizza 1">
                </a>

                <a href="index-2.html">
                    <img src="top-view-pizza-with-ai-generated-free-png (2) 2.png"
                         class="w-[80px] sm:w-[120px] lg:w-[180px]" alt="Pizza 2">
                </a>

                <a href="index3.html">
                    <img src="top-view-pizza-with-ai-generated-free-png 2.png"
                         class="w-[80px] sm:w-[120px] lg:w-[180px]" alt="Pizza 3">
                </a>
            </div>

            <!-- Main pizza -->
            <div class="order-1 md:order-2 shrink-0 flex justify-center">
                <img class="picture w-[220px] h-[220px] sm:w-[300px] sm:h-[300px] lg:w-[400px] lg:h-[400px] object-contain"
                     src=" /top-view-pizza-with-ai-generated-free-png (1) 2.png"alt="Main Pizza">
            </div>

        </div>
    </div>

    <!-- Order bar -->
    <div class="flex items-center justify-between gap-4 px-5 mt-8 md:mt-10 pb-6">
        <p>Customize order</p>

        <button class="bg-[#D13E3E] text-white rounded-xl px-5 sm:px-6 py-2 sm:py-3">
            Rs. 1,260
        </button>
    </div>

</body>
</html>
